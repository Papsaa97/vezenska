<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Akademie VS ČR – Studijní portál ZOP A</title>
    <meta name="description" content="Studijní portál a offline příprava na zkoušky ZOP A Vězeňské služby ČR." />
    
    <!-- PWA & Offline Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Barva pozadí dokumentu musí sedět s motivem dřív, než se načte
         aplikace: jinak prohlížeč krátce (a při rychlém scrollování na
         slabším zařízení opakovaně) ukazuje bílou plochu. Stejné pravidlo
         jako výchozí stav v App.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('vscr_theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* bez přístupu k úložišti zůstane světlé pozadí */ }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Akademie VS ČR" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Akademie VS ČR – ZOP A" />
    <meta property="og:description" content="Příprava na zkoušky Vězeňské služby ČR, předpisy, testy a kartičky." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
